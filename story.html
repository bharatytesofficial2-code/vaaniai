<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Mode — Bharat Bytes AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D4A017; --gold-light: #F0C040; --gold-dim: #8B6914;
    --bg: #0A0A0A; --bg-card: #111; --border: rgba(212,160,23,0.18);
    --text: #E8E8E8; --text-muted: #888;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #0a0a1a;
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .page-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 20px; padding: 40px 20px; text-align: center; max-width: 480px;
  }
  .page-icon {
    width: 90px; height: 90px;
    border: 2px solid var(--gold-dim);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 40px;
    background: rgba(212,160,23,0.08);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(212,160,23,0.3); }
    50% { box-shadow: 0 0 0 16px rgba(212,160,23,0); }
  }
  .page-title {
    font-family: 'Cinzel', serif;
    font-size: 28px; font-weight: 700;
    color: var(--gold);
  }
  .page-sub { font-size: 15px; color: var(--text-muted); line-height: 1.6; }
  .badge {
    background: rgba(212,160,23,0.1);
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 6px 16px; border-radius: 99px;
    font-size: 12px; font-weight: 600;
    letter-spacing: .5px;
  }
  .btn-back {
    display: flex; align-items: center; gap: 8px;
    background: transparent;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 12px 28px;
    border-radius: 99px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all .22s ease;
    margin-top: 10px;
  }
  .btn-back:hover { background: var(--gold); color: #000; border-color: var(--gold); }
  .dots { display: flex; gap: 6px; margin-top: 4px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold-dim);
    animation: blink 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .22s; }
  .dot:nth-child(3) { animation-delay: .44s; }
  @keyframes blink { 0%,80%,100% { opacity:.2; } 40% { opacity:1; } }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-icon">📖</div>
  <div class="badge">⚙ Coming Soon</div>
  <h1 class="page-title">Story Mode</h1>
  <p class="page-sub">Immersive stories crafted just for you.</p>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <a class="btn-back" href="index.html">← Back to Home</a>
</div>
</body>
</html>
